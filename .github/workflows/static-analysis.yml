name: Static Code Analysis

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: none

jobs:
  test-harnesses:
    name: Run Local Test Harnesses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check harnesses for forbidden operations
        shell: sh
        run: |
          forbidden_pattern='/etc/hosts|(^|[^[:alnum:]_.-])(sudo|pkexec|curl|wget|apt-get|apt|apk|dnf|yum|pacman|zypper|brew|npm|pnpm|yarn|pip|pip3|gem|composer)([^[:alnum:]_.-]|$)|(^|[^[:alnum:]_.-])(go|cargo)[[:space:]]+install([^[:alnum:]_.-]|$)|(^|[^[:alnum:]_.-])git([[:space:]]+[^[:space:];|&()<>]+){0,8}[[:space:]]+(clone|fetch|pull|push|remote|submodule|ls-remote)([^[:alnum:]_.-]|$)'

          if find tests -type f -exec sh -c '
            pattern=$1
            shift
            found=0

            for file do
              grep -nE "$pattern" "$file"
              status=$?

              if [ "$status" -eq 0 ]; then
                found=1
              elif [ "$status" -gt 1 ]; then
                exit "$status"
              fi
            done

            exit "$found"
          ' sh "$forbidden_pattern" {} +; then
            exit 0
          fi

          echo "Forbidden operation found under tests/. Harnesses must not touch hosts, elevate privileges, install packages, download code, or use git network commands."
          exit 1

      - name: Run local test harnesses
        shell: sh
        run: |
          set -- tests/run-*.sh
          if [ "$1" = 'tests/run-*.sh' ]; then
            echo "No local test harnesses found."
            exit 1
          fi

          for script do
            sh "$script"
          done

  scan-build:
    name: Run Clang Analyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      CC: clang
      CCC_CC: clang
      SCANBUILD_DIR: /tmp/scanbuild
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install clang-tools
        run: sudo apt-get update && sudo apt-get install -y clang-tools

      - name: Run analysis
        run: |
          scan-build -sarif --status-bugs -no-failure-reports -o "${SCANBUILD_DIR}" \
            clang -Wall -O2 -o dev-env-update-hosts cc/dev-env-update-hosts.c
        continue-on-error: true
        id: scanbuild

      - name: Merge reports
        run: |
          pip install sarif-tools
          sarif copy --output /tmp/merged.sarif "${SCANBUILD_DIR}/**/*.sarif"
          jq 'del(.runs[].conversion)' /tmp/merged.sarif > /tmp/scan-build.sarif
          if [ $(jq '[.runs[].results | length] | add' /tmp/scan-build.sarif) -gt 0 ]; then
            exit 1
          fi
          exit 0
        id: merge
        continue-on-error: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: /tmp/scan-build.sarif
          category: scanbuild
        continue-on-error: true

      - name: Set exit code
        run: exit 1
        if: steps.scanbuild.outcome == 'failure' || steps.merge.outcome == 'failure'
