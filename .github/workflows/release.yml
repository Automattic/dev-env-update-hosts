name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  prepare_release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: push
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=local,dest=out

      - name: Compress artifacts and generate checksums
        run: |
          for i in dev-env-update-hosts-*; do
            gzip -9n "${i}";
            sha256sum "${i}.gz" | awk '{print $1}' > "${i}.gz.sum";
          done
        working-directory: out

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/dev-env-update-hosts-*

      - name: Generate provenance file
        run: |
          jq .dsseEnvelope "${{ steps.attest.outputs.bundle-path }}" > out/dev-env-update-hosts.intoto.jsonl

      - name: Create a release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            out/*.gz
            out/*.gz.sum
            out/dev-env-update-hosts.intoto.jsonl
